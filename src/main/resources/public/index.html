<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TilePaint</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div id = "homeScreen">
        <h1>PaintGame</h1>
        <input id = "nameInput" type="text" placeholder="enter your name" maxlength="12">
        <button id = "playButton">Play</button>
    </div>
    <canvas id = "game" width="640" height="480">
    </canvas>
    <table>
        <tr>
            <td><button id="redButton"></button></td>
            <td><button id="blueButton"></button></td>
            <td><button id="yellowButton"></button></td>
        </tr>
        <td><button id="greenButton"></button></td>
        <td><button id="blackButton"></button></td>
        <td><button id="whiteButton"></button></td>
        <tr>

        </tr>
    </table>
    <input type="color" id="colorPicker" value="#ffffff">
    <p>wasd to move</p>
    <p>space to paint</p>
    <p>shift to sprint</p>
    <p> q to match colors</p>
    <script src = "script.js"></script>
</body>
</html>
